name: High Elo tracker

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'tracker/**'
      - '.github/workflows/tracker-pages.yml'
      - 'reconstruction/tools/**'
  workflow_run:
    workflows: ['Replay archive']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: high-elo-tracker-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test historical ranks, statistics, refresh recovery, and packaging
        run: python -m unittest discover -s tracker -p 'test_*.py' -v
      - name: Test browser statistics
        run: node tracker/test_static.mjs
      - name: Restore recent replays and verified decoding cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            tracker/.cache/decoded
            tracker/.cache/current
          key: tracker-current-v2-${{ runner.os }}-${{ hashFiles('tracker/replay_extract.py', 'tracker/protocol.py', 'tracker/formats.py') }}-${{ github.run_id }}
          restore-keys: |
            tracker-current-v2-${{ runner.os }}-${{ hashFiles('tracker/replay_extract.py', 'tracker/protocol.py', 'tracker/formats.py') }}-
      - name: Fetch current leaderboard games and build the static dashboard
        run: python tracker/build_pages.py --outdir .site
      - name: Validate the published browser dataset
        run: node -e "require('./tracker/web/stats.js').validateDataset(require('./.site/data.json'))"
      - name: Upload the website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the tracker
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Link the hosted dashboard
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "[Open the High Elo tracker]($PAGE_URL)" >> "$GITHUB_STEP_SUMMARY"
